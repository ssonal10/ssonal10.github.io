<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Layout B colors</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0b0b09; --fg:#f3efe6; --accent:#c8f05a; --muted:rgba(243,239,230,.6); --card:#151512; --line:rgba(243,239,230,.12); --chip:rgba(243,239,230,.2); --topo:1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 'Instrument Sans',sans-serif; transition:background-color .8s, color .8s; }
  .label { font:12px 'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .display { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; letter-spacing:-.04em; line-height:.95; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }

  .switch { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:30; display:flex; gap:6px; padding:6px; border-radius:999px; background:rgba(20,20,18,.85); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12); max-width:calc(100vw - 24px); overflow-x:auto; }
  .switch button { all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; color:#f3efe6; font:12px 'JetBrains Mono',monospace; white-space:nowrap; }
  .switch button.on { background:#f3efe6; color:#0b0b09; }
  .sw { width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.3); }

  .intro { padding:72px 0 8px; }
  .intro h1 { font-size:clamp(40px,7vw,88px); }
  .intro p { max-width:620px; color:var(--muted); margin-top:16px; }
  .intro .name { color:var(--accent); }

  .case { min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:center; padding:64px 0; border-bottom:1px solid var(--line); }
  .vis { position:relative; overflow:hidden; border-radius:20px; background:var(--card); min-height:70vh; display:flex; align-items:flex-end; padding:28px; transition:background-color .8s; }
  .vis::before { content:''; position:absolute; inset:0; background:url(/fx/topo.svg) center/cover; opacity:.14; filter:invert(var(--topo)); }
  .big { position:relative; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(56px,8vw,120px); line-height:.9; letter-spacing:-.04em; color:var(--accent); }
  .big small { display:block; font:14px 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--fg); margin-top:12px; }
  .case h3 { font-size:clamp(48px,7vw,104px); margin:8px 0 28px; }
  .case .kind { color:var(--accent); }
  .pbr { display:grid; grid-template-columns:90px 1fr; gap:14px 18px; }
  .pbr dt { font:12px 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); padding-top:4px; }
  .pbr dd { opacity:.88; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:22px; }
  .chips span { border:1px solid var(--chip); border-radius:999px; padding:3px 10px; font:11px 'JetBrains Mono',monospace; opacity:.8; }
  .reveal { opacity:0; transform:translateY(40px); transition:opacity 1s, transform 1s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity:1; transform:none; }
  @media (max-width:760px) { .case { grid-template-columns:1fr; min-height:auto; } .vis { min-height:40vh; } }
  .end { padding:120px 0 160px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap intro">
  <p class="label">Layout B · color options</p>
  <h1 class="display">Pick a palette.</h1>
  <p>Switch palettes with the bar at the bottom, then scroll through the three cases. <span class="name">Chameleon</span> changes the whole page color per project as you scroll, the way Unseen does.</p>
</div>
<div class="wrap" id="cases"></div>
<div class="wrap end"><p class="label">End of sample</p></div>

<div class="switch" id="switch"></div>

<script>
const PAL = {
  'Ink + lime':   { bg:'#0b0b09', fg:'#f3efe6', accent:'#c8f05a', card:'#151512', topo:1, note:'current site' },
  'Paper + ink':  { bg:'#f3efe6', fg:'#0b0b09', accent:'#2f6b1f', card:'#e7e1d3', topo:0, note:'light, editorial' },
  'Glacier':      { bg:'#08131a', fg:'#e8f4f3', accent:'#5cc8c2', card:'#0f222b', topo:1, note:'cool teal' },
  'Obys orange':  { bg:'#111111', fg:'#f2f2f2', accent:'#ff5a2e', card:'#1b1b1b', topo:1, note:'warm, bold' },
  'Plum + pink':  { bg:'#160f1f', fg:'#f6eef7', accent:'#ff8fd1', card:'#21172e', topo:1, note:'playful' },
  'Chameleon':    { chameleon:true, note:'color per project' },
};
// per-project colors for Chameleon
const CHAM = [
  { bg:'#0f1b3d', fg:'#eef2ff', accent:'#8fb3ff', card:'#17264f', topo:1 },
  { bg:'#c8f05a', fg:'#0b0b09', accent:'#0b0b09', card:'#b6dd4b', topo:0 },
  { bg:'#f3efe6', fg:'#0b0b09', accent:'#ff5a2e', card:'#e7e1d3', topo:0 },
];
const P = [
  { n:'01', name:'Deal agent', kind:'LLM agent · launched', year:'2026', big:'weeks → min', bigsm:'per deal model',
    problem:'Leaders wanted several deal models before locking a partnership, and each one took weeks in Excel.',
    built:'An LLM agent on 20+ live data sources. The LLM only routes, Python computes every number, and each run ends in a dashboard leaders can change.',
    result:'Replaced about 6 months of manual modeling in its first week and underwrote deals bringing 4M access-plan customers and 3M general customers.',
    stack:['Strands Agents','Bedrock AgentCore','Python','S3','IAM'] },
  { n:'02', name:'Auto-activation', kind:'Measurement', year:'2025', big:'7M', bigsm:'new active members',
    problem:'Every partner launch needed a lift read within a week, from systems that did not share customer IDs.',
    built:'One framework joining experiment, streaming, website and subscription data, plus a fix for about 30K customers sitting in both control and test.',
    result:'VPs expanded the feature across 13 partners. It now contributes 7M new active members, 5.5M of them engaged.',
    stack:['Glue','Spark','Athena','QuickSight'] },
  { n:'03', name:'Sentinel', kind:'Multi-agent · built solo', year:'2026', big:'10 days → 10 min', bigsm:'per team question',
    problem:"The team's ad-hoc questions waited about 10 days for an answer.",
    built:'Alone, a 24/7 multi-agent assistant: 19 scheduled jobs, 5 read-only specialists, a validator and a 1,995-concept knowledge base.',
    result:'Answers in about 10 minutes, and a poster at a company-wide analytics conference, top 20 of 1,100.',
    stack:['Claude Code','Python','SQLite FTS5','Slack'] },
];
document.getElementById('cases').innerHTML = P.map((p,i)=>`
  <article class="case" data-i="${i}">
    <div class="reveal"><div class="vis"><div class="big">${p.big}<small>${p.bigsm}</small></div></div></div>
    <div class="reveal"><span class="label kind">${p.n} · ${p.kind} · ${p.year}</span><h3 class="display">${p.name}</h3>
      <dl class="pbr"><dt>Problem</dt><dd>${p.problem}</dd><dt>Built</dt><dd>${p.built}</dd><dt>Result</dt><dd>${p.result}</dd></dl>
      <div class="chips">${p.stack.map(s=>`<span>${s}</span>`).join('')}</div></div>
  </article>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.25});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

const root=document.documentElement.style;
function apply(c){
  const dark = c.topo===1;
  root.setProperty('--bg',c.bg); root.setProperty('--fg',c.fg); root.setProperty('--accent',c.accent); root.setProperty('--card',c.card);
  root.setProperty('--topo',c.topo);
  root.setProperty('--muted', dark ? 'rgba(243,239,230,.6)' : 'rgba(11,11,9,.6)');
  root.setProperty('--line', dark ? 'rgba(243,239,230,.12)' : 'rgba(11,11,9,.14)');
  root.setProperty('--chip', dark ? 'rgba(243,239,230,.22)' : 'rgba(11,11,9,.25)');
}
let mode='Ink + lime';
const caseIO=new IntersectionObserver(es=>es.forEach(e=>{ if(mode==='Chameleon' && e.isIntersecting) apply(CHAM[+e.target.dataset.i]); }),{rootMargin:'-45% 0px -45% 0px'});
document.querySelectorAll('.case').forEach(c=>caseIO.observe(c));
function setMode(m){
  mode=m;
  document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(PAL[m].chameleon){
    // pick the case nearest the middle of the screen
    const mid=innerHeight/2; let best=0,d=1e9;
    document.querySelectorAll('.case').forEach((c,i)=>{const r=c.getBoundingClientRect();const dd=Math.abs((r.top+r.bottom)/2-mid);if(dd<d){d=dd;best=i;}});
    apply(CHAM[best]);
  } else apply(PAL[m]);
}
const sw=document.getElementById('switch');
sw.innerHTML=Object.entries(PAL).map(([k,v])=>{
  const dot = v.chameleon ? `background:conic-gradient(#8fb3ff 0 33%,#c8f05a 0 66%,#ff5a2e 0)` : `background:linear-gradient(135deg,${v.bg} 50%,${v.accent} 50%)`;
  return `<button data-m="${k}" title="${v.note}"><span class="sw" style="${dot}"></span>${k}</button>`;
}).join('');
sw.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode(mode);
</script>
</body>
</html>
